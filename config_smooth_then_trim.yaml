  width: 240
  height: 240
  crop_mode: center_square
  codec: libx264
  crf: 18
  preset: medium
  pixel_format: yuv420p
  workers: 4
  ffmpeg: ffmpeg
  ffprobe: ffprobe
metadata:
  video_stats_frames_per_episode: 100
visualization:
  point_radius_m: 0.0012
  path_radius_m: 0.00035
