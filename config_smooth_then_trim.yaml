  chunks_size: 1000
  overwrite: true
task:
  prompt: Pick up the red cup and place it on the yellow plate.
trajectory:
  position_indices:
  - 0
  - 1
  - 2
  quaternion_indices:
  - 3
  - 4
  - 5
  - 6
  quaternion_order: xyzw
  gripper_index: 7
  pose_transform:
    enabled: false
    rotation_order: intrinsic_xyz
    rotation_deg:
      x: 30.0
      y: 0.0
      z: -90.0
